    <path d="M738 620 1098 568 1200 628 846 684z" fill="url(#steel)"/>
    <g fill="#1b2023" opacity=".75">
      <ellipse cx="858" cy="608" rx="55" ry="22"/>
      <ellipse cx="1024" cy="588" rx="55" ry="22"/>
      <ellipse cx="1148" cy="624" rx="45" ry="18"/>
    </g>
    <g fill="#9fa8ad">
