<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="CCTV view of an automotive robot fastening cell">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6268"/>
      <stop offset=".5" stop-color="#4a5055"/>
      <stop offset="1" stop-color="#35393d"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f565b"/>
      <stop offset="1" stop-color="#30363a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9b1b6"/>
      <stop offset=".45" stop-color="#667076"/>
      <stop offset="1" stop-color="#2d3337"/>
    </linearGradient>
    <linearGradient id="robot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c76d24"/>
      <stop offset=".42" stop-color="#a44c17"/>
      <stop offset="1" stop-color="#5f2d14"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .16"/>
      </feComponentTransfer>
      <feBlend mode="soft-light" in2="SourceGraphic"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#101315" flood-opacity=".5"/>
    </filter>
    <pattern id="mesh" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M0 0h36M0 0v36" fill="none" stroke="#1c2226" stroke-width="3" opacity=".62"/>
      <path d="M18 0v36M0 18h36" fill="none" stroke="#6b7378" stroke-width="1" opacity=".22"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0h4v1H0z" fill="#fff" opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#31383d"/>
  <path d="M0 0h1600v255H0z" fill="url(#wall)"/>
  <path d="M0 250 1600 190v710H0z" fill="url(#floor)"/>

  <g opacity=".28" fill="none" stroke="#c5ccd0" stroke-width="2">
    <path d="M120 900 500 230M390 900 650 225M680 900 800 218M980 900 970 212M1260 900 1130 205M1510 900 1280 198"/>
    <path d="M0 812h1600M0 714h1600M0 610h1600M0 498h1600M0 382h1600"/>
  </g>

  <g opacity=".82">
    <rect x="88" y="300" width="640" height="292" fill="#22272a"/>
    <rect x="88" y="300" width="640" height="292" fill="url(#mesh)"/>
    <g stroke="#d3a12c" stroke-width="11">
      <path d="M88 300v292M728 300v292M300 285v318M520 275v335"/>
    </g>
  </g>

  <g opacity=".7">
    <rect x="92" y="114" width="180" height="74" rx="5" fill="#697278"/>
    <rect x="122" y="136" width="120" height="26" rx="3" fill="#2e363b"/>
    <rect x="320" y="92" width="230" height="92" rx="6" fill="#5e686e"/>
    <rect x="354" y="120" width="162" height="28" rx="3" fill="#2e363b"/>
