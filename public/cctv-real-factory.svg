    <rect x="1216" y="342" width="238" height="28" rx="4" fill="#82909a"/>
    <rect x="1216" y="398" width="238" height="26" rx="4" fill="#77858e"/>
    <rect x="1216" y="452" width="238" height="26" rx="4" fill="#77858e"/>
    <path d="M1185 524h310" stroke="#d5a42e" stroke-width="9"/>
  </g>

  <g opacity=".5" stroke="#eef3f4" stroke-width="3" fill="none">
    <path d="M650 446h70M862 408h90M1050 382h85M1260 270h130"/>
    <path d="M720 446c18-34 46-53 82-58M952 408c28-32 60-46 98-42"/>
