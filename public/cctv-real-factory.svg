  <rect width="1600" height="900" fill="#11161a" opacity=".12"/>
  <rect width="1600" height="900" fill="url(#scan)"/>
  <rect width="1600" height="900" fill="#7d858a" filter="url(#grain)" opacity=".18"/>
  <path d="M0 0h1600v900H0z" fill="none" stroke="#0b0e10" stroke-width="36" opacity=".45"/>
