    <path d="M1026 460 C962 426 895 386 843 335" fill="none" stroke="url(#robot)" stroke-width="76" stroke-linecap="round"/>
    <circle cx="842" cy="334" r="54" fill="url(#robot)"/>
    <path d="M815 320 C744 334 680 382 642 448" fill="none" stroke="url(#robot)" stroke-width="62" stroke-linecap="round"/>
    <circle cx="638" cy="451" r="44" fill="url(#robot)"/>
    <path d="M619 482 592 595" stroke="#22282b" stroke-width="38" stroke-linecap="round"/>
    <path d="M596 596 574 646" stroke="#8b969b" stroke-width="18" stroke-linecap="round"/>
    <circle cx="574" cy="650" r="18" fill="#2a3034"/>
    <g fill="none" stroke="#22282b" stroke-width="12" opacity=".8">
      <path d="M1047 430 C1115 386 1166 362 1238 360"/>
      <path d="M820 290 C780 234 744 200 680 176"/>
